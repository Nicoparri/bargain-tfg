# render.free.yaml — Despliegue de bajo coste de BarGAIN en Render.
#
# Despliegue de pago básico con Celery separado en su propio background worker:
#
#   1. bargain-free-api    Web Service Django (Gunicorn) — solo HTTP, sin Celery
#                          → plan starter ($7/mes, 0.5 CPU, 512 MB), sin spin-down
#   2. bargain-free-worker Background Worker Celery (worker + beat embebidos)
#                          → plan starter ($7/mes); los workers NO tienen free tier
#   3. bargain-free-redis  Key Value (Valkey) gratuito — broker Celery + cache (efímero)
#   4. bargain-free-db     PostgreSQL (PostGIS) — plan basic-256mb ($6/mes + almacenamiento)
#
# Notas:
#   - Celery worker+beat ya NO van embebidos en el web: corren en bargain-free-worker
#     para que el scraping (Playwright/Chromium) no compita por la RAM de Gunicorn.
#   - El web service ya NO se duerme (starter); el worker corre 24/7.
#   - El Postgres basic-256mb es persistente y ya NO caduca (a diferencia del free,
#     que se borra a los 30 días).
#   - bargain-free-redis sigue en free (efímero, 25 MB): vale como broker/cache.
#   - Coste aproximado: web $7 + worker $7 + db $6 (+almacenamiento) ≈ $20/mes.
#
# NOTA: la API REST de Render no aplica blueprints automáticamente; este fichero
# documenta y reproduce el despliegue que se crea vía API. Para aplicarlo a mano:
# Render Dashboard -> New -> Blueprint -> seleccionar este repo y este archivo.
#
# Variables con sync: false se configuran en el Dashboard / vía API (no en el repo).

databases:
  - name: bargain-free-db
    databaseName: bargain
    user: bargain
    plan: basic-256mb
    diskSizeGB: 1
    region: frankfurt

services:
  # ── Web Service: Django API con Gunicorn (sin Celery) ───────────────────────
  - type: web
    name: bargain-free-api
    runtime: docker
    repo: https://github.com/Nicoparri/bargain-tfg
    branch: main
    region: frankfurt
    plan: starter
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: .
    dockerCommand: sh /app/scripts/start_render_free.sh
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: bargain-free-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: bargain-free-redis
          type: keyvalue
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://bargain-app.onrender.com,https://nicoparri.github.io,http://localhost:5173,http://localhost:3000,http://localhost:8081,http://127.0.0.1:8081
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GOOGLE_CLOUD_VISION_API_KEY
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  # ── Background Worker: Celery worker + beat (servicio dedicado) ──────────────
  # Reutiliza Dockerfile.render (incluye Chromium para los spiders). Los workers
  # no tienen free tier en Render, por eso usa plan starter.
  - type: worker
    name: bargain-free-worker
    runtime: docker
    repo: https://github.com/Nicoparri/bargain-tfg
    branch: main
    region: frankfurt
    plan: starter
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: .
    dockerCommand: sh /app/scripts/start_render_worker.sh
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SCRAPING_PROJECT_DIR
        value: /scraping
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: DATABASE_URL
        fromDatabase:
          name: bargain-free-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: bargain-free-redis
          type: keyvalue
          property: connectionString

  # ── Key Value (Redis) gratuito: broker Celery + cache ───────────────────────
  - type: keyvalue
    name: bargain-free-redis
    plan: free
    region: frankfurt
    ipAllowList:
      - source: 0.0.0.0/0
        description: all
    maxmemoryPolicy: noeviction
