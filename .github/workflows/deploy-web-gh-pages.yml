name: Deploy Web Landing To GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/web/**'
      - '.github/workflows/deploy-web-gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      VITE_BASE_PATH: '/bargain-tfg/'
      VITE_DEMO_VIDEO_URL: 'https://youtu.be/EdZuggir4dY'
      VITE_API_URL: 'https://bargain-free-api.onrender.com/api/v1'
      # Clave del navegador para el autocompletado de direcciones (Places).
      # Se define como secreto del repositorio; nunca se incrusta en el código.
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend/web
          npm install

      - name: Build
        run: |
          cd frontend/web
          npm run build

      # Publica también los mockups de UI (docs/diagramas/ui-mockups) en
      # https://nicoparri.github.io/bargain-tfg/mockups/ para enlazarlos desde el README.
      - name: Add UI mockups
        run: |
          test -f docs/diagramas/ui-mockups/index.html
          mkdir -p frontend/web/dist/mockups
          cp -R docs/diagramas/ui-mockups/. frontend/web/dist/mockups/
          rm -f frontend/web/dist/mockups/README.md

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
