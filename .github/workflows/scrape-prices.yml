name: Scrape Prices

# Ejecuta los spiders de Scrapy en runners de GitHub (gratis) y persiste los
# precios directamente en la base de datos de Render mediante el pipeline
# PriceUpsertPipeline (Django ORM).
#
# Optimización de tiempo:
#   - Cada spider se ejecuta en un JOB INDEPENDIENTE en paralelo (matriz), de
#     modo que el tiempo total ya no es la suma de los cuatro, sino el del más
#     lento. Cada job tiene su propio presupuesto de tiempo.
#   - Se sube la concurrencia y se baja el retardo entre peticiones mediante
#     overrides -s (prioridad 'cmdline', que prevalece sobre el custom_settings
#     de cada spider). Mercadona pasaba de ~1 petición cada 2 s a varias en
#     paralelo, que es lo que hacía que superara los 30 minutos.
#   - Playwright (con su navegador) solo se instala para Carrefour, el único
#     spider que lo necesita; los demás arrancan mucho antes.
#
# REQUISITO (una sola vez): añadir en GitHub el secreto del repositorio
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     Name:  RENDER_DATABASE_URL
#     Value: la "External Database URL" de tu Postgres de Render.

# Ejecución programada DESACTIVADA: la base de datos de staging en Render ya no
# está activa y cada ejecución acababa cancelada por timeout. Para reactivarla,
# vuelve a añadir el bloque `schedule` cuando el backend esté de nuevo en línea:
#   schedule:
#     - cron: '0 6,18 * * *'   # Dos veces al día (UTC); los precios caducan a las 48 h
on:
  workflow_dispatch: {}

concurrency:
  group: scrape-prices
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape ${{ matrix.spider }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        spider: [mercadona, carrefour, dia, lidl]
    env:
      PYTHON_VERSION: '3.12'
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_PROJECT_DIR: ${{ github.workspace }}/backend
      DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
      # No se arranca ningún worker Celery durante el crawl; valor de relleno
      # para que la importación de settings no falle.
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Comprobar que el secreto existe
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::Falta el secreto RENDER_DATABASE_URL. Añádelo en Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - name: Instalar GDAL (requerido por django.contrib.gis)
        run: sudo apt-get update && sudo apt-get install -y gdal-bin libgdal-dev

      - name: Instalar dependencias
        run: pip install -r backend/requirements/dev.txt

      - name: Instalar navegador de Playwright (Carrefour y DIA)
        if: matrix.spider == 'carrefour' || matrix.spider == 'dia'
        run: python -m playwright install --with-deps chromium

      - name: Ejecutar spider ${{ matrix.spider }}
        working-directory: scraping
        run: |
          python -m scrapy crawl "${{ matrix.spider }}" \
            -s AUTOTHROTTLE_ENABLED=True \
            -s AUTOTHROTTLE_START_DELAY=0.5 \
            -s AUTOTHROTTLE_MAX_DELAY=10 \
            -s AUTOTHROTTLE_TARGET_CONCURRENCY=8 \
            -s CONCURRENT_REQUESTS=16 \
            -s CONCURRENT_REQUESTS_PER_DOMAIN=16 \
            -s DOWNLOAD_DELAY=0 \
            -s RETRY_TIMES=2 \
            -s CLOSESPIDER_TIMEOUT=1200
